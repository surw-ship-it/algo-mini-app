<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Algorand Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="10483596" data-sdk="show_10483596"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#020617;font-family:Inter,system-ui,Arial;color:#fff;}
#app{min-height:100vh;padding:16px 0 80px}
.card{width:92%;max-width:390px;margin:0 auto;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:22px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:30px}
.balance-box{margin:20px 0;padding:18px;border-radius:18px;background:rgba(255,255,255,.14);text-align:center;}
.balance-row{display:flex;justify-content:center;align-items:center;gap:8px}.balance-amount{font-size:34px;font-weight:800}
.withdraw-btn,.spinner-btn{margin-top:12px;padding:14px;width:100%;border:none;border-radius:14px;color:#fff;font-size:15px;cursor:pointer;transition: opacity 0.2s}
.withdraw-btn:active, .spinner-btn:active{opacity: 0.8}
.withdraw-btn{background:linear-gradient(135deg,#22c55e,#16a34a)}
.spinner-btn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.section{margin-top:18px}.section h3{margin:0 0 10px;font-size:15px}
button{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#2563eb);transition: opacity 0.2s}
button:disabled{opacity:.5;cursor:not-allowed}
.counter{margin-top:8px;font-size:13px;color:#facc15;text-align:center}
.links{display:grid;gap:10px}
.link-wrap{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px}
.link-wrap button{padding:10px;font-size:14px;border-radius:12px;background:rgba(255,255,255,.08)}
.timer{margin-top:6px;font-size:12px;color:#facc15;text-align:center}

/* POPUPS */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;justify-content:center;align-items:center;z-index:9999;backdrop-filter:blur(4px)}
.popup-card{background:#0f172a;border-radius:20px;padding:22px;width:85%;max-width:320px;text-align:center}
.popup-card input{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#020617;color:#fff}
.popup-warn{font-size:12px;color:#facc15;margin-top:6px;margin-bottom:10px}
.reward-logo{width:56px;height:56px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.reward-logo img{width:32px}

/* SPINNER */
#spinnerPopup{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;justify-content:center;align-items:center;z-index:99999;backdrop-filter:blur(4px)}
.spinner-card{background:#0f172a;width:320px;padding:20px;border-radius:22px;text-align:center}
#wheelWrap{position:relative;width:260px;height:260px;margin:10px auto;overflow:hidden;border-radius:50%;border:4px solid #334155}
#wheel{width:100%;height:100%;border-radius:50%;}
#pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%) rotate(180deg);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #facc15;z-index:10;filter:drop-shadow(0 -2px 4px rgba(0,0,0,0.5))}
.winPopup{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.4);z-index:100000}
.winCard{background:#020617;padding:20px 26px;border-radius:18px;animation:fadeOut 3s forwards;text-align:center;font-weight:700;font-size:16px;color:#fff;border:1px solid rgba(255,255,255,0.2)}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>
<div id="app">
  <div class="card">
    <div class="brand">
      <img src="https://cryptologos.cc/logos/algorand-algo-logo.png"> Algorand Earn
    </div>

    <div class="balance-box">
      <div>Toplam Bakiye</div>
      <div class="balance-row">
        <div class="balance-amount" id="balance">0.000</div>
        <img src="https://cryptologos.cc/logos/algorand-algo-logo.png" width="22">
      </div>
      <button class="withdraw-btn" id="openWithdraw">💸 Çekim Yap</button>
      <button class="spinner-btn" id="openSpinner">🎡 0.25 ALGO karşılığında şansını dene!</button>
    </div>

    <div class="section">
      <h3>🎬 Reklam İzleyerek Kazan</h3>
      <button id="watchAd" style="margin-bottom: 8px;">Reklam İzle (+0.1 ALGO)</button>
      <div class="counter" id="adCounter"></div>
    </div>

    <div class="section">
      <h3>🔗 Ödüllü Linkler</h3>
      <div class="links" id="links"></div>
    </div>
  </div>
</div>

<div class="popup" id="withdrawPopup">
  <div class="popup-card">
    <div class="reward-logo">
      <img src="https://cryptologos.cc/logos/algorand-algo-logo.png">
    </div>
    <h3>Çekim Talebi</h3>
    <p>Mevcut bakiye: <b id="popupBalance">0.000 ALGO</b></p>
    <input id="wallet" placeholder="Algorand cüzdan adresi">
    <input id="amount" type="number" step="0.001" placeholder="Çekilecek miktar">
    <div class="popup-warn">Minimum çekim: 12 ALGO</div>
    <button id="sendWithdrawBtn">Gönder</button>
    <button id="closeWithdrawBtn" style="margin-top:8px;background:#334155">İptal</button>
  </div>
</div>

<div id="spinnerPopup">
  <div class="spinner-card">
    <h3 style="margin-top:0;">🎡 Şans Çarkı</h3>
    <p style="font-size: 13px; color:#94a3b8; margin-top: -6px;">Her çevirme 0.25 ALGO değerindedir.</p>
    <div id="wheelWrap">
      <div id="pointer"></div>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>
    <button id="spinBtn">Çevir (0.25 ALGO)</button>
    <button id="closeSpinnerBtn" style="margin-top:8px;background:#334155">Kapat</button>
  </div>
</div>

<div class="winPopup" id="winPopup">
  <div class="winCard" id="winText"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

  if(window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  // State Management - Merkezi kontrol
  let balance = Number(localStorage.getItem("balance")) || 0;
  let dailyAds = Number(localStorage.getItem("dailyAds"));
  if (isNaN(dailyAds)) dailyAds = 30; // İlk giriş
  
  let lastDay = localStorage.getItem("lastAdDay") || new Date().toDateString();

  const balanceEl = document.getElementById("balance");
  const adCounter = document.getElementById("adCounter");

  function updateBalance(newAmount) {
    balance = newAmount;
    localStorage.setItem("balance", balance.toString());
    balanceEl.innerText = balance.toFixed(3);
  }
  
  updateBalance(balance); // İlk yüklemede arayüzü eşitle

  /* ADS - Reklam Modülü */
  function resetAds(){
    const t = new Date().toDateString();
    if(t !== lastDay){
      dailyAds = 30;
      lastDay = t;
      localStorage.setItem("dailyAds", 30);
      localStorage.setItem("lastAdDay", t);
    }
  }
  resetAds();
  adCounter.innerText = `Günlük reklam hakkınız: ${dailyAds} / 30`;

  document.getElementById("watchAd").addEventListener("click", async (e) => {
    if(dailyAds <= 0){ alert("Günlük limit doldu!"); return; }
    const btn = e.target;
    btn.disabled = true;
    
    try {
      // AdBlock Koruması
      if (typeof show_10483596 === "function") {
        await show_10483596();
      } else {
        console.warn("Reklam SDK bulunamadı (Adblock?). Offline test modunda simüle ediliyor...");
        await new Promise(res => setTimeout(res, 1000)); 
      }
      
      dailyAds--;
      updateBalance(balance + 0.1);
      localStorage.setItem("dailyAds", dailyAds);
      adCounter.innerText = `Günlük reklam hakkınız: ${dailyAds} / 30`;
    } catch(err) {
      console.error(err);
      alert("Reklam yüklenirken hata oluştu.");
    } finally {
      btn.disabled = false;
    }
  });

  /* WITHDRAW - Çekim Modülü */
  const openWithdraw = document.getElementById("openWithdraw");
  const withdrawPopup = document.getElementById("withdrawPopup");
  const closeWithdrawBtn = document.getElementById("closeWithdrawBtn");
  const sendWithdrawBtn = document.getElementById("sendWithdrawBtn");
  const popupBalance = document.getElementById("popupBalance");

  openWithdraw.addEventListener("click", () => {
    popupBalance.innerText = balance.toFixed(3) + " ALGO";
    document.getElementById("wallet").value = "";
    document.getElementById("amount").value = "";
    withdrawPopup.style.display = "flex";
  });
  
  closeWithdrawBtn.addEventListener("click", () => { withdrawPopup.style.display = "none"; });
  
  sendWithdrawBtn.addEventListener("click", () => {
    const w = document.getElementById("wallet").value.trim();
    const a = parseFloat(document.getElementById("amount").value);
    
    // Algorand adresi doğrulama regex'i
    if(!/^[A-Z2-7]{58}$/.test(w)){ alert("Lütfen geçerli bir Algorand (ALGO) adresi giriniz."); return; }
    if(isNaN(a) || a < 12){ alert("Minimum çekim miktarı 12 ALGO'dur."); return; }
    if(a > balance){ alert("Yetersiz bakiye."); return; }
    
    updateBalance(balance - a);
    withdrawPopup.style.display = "none";
    alert(`Başarılı! ${a} ALGO çekim talebiniz işleme alındı.\n(Adres: ${w.substring(0,6)}...${w.slice(-4)})`);
  });

  /* LINKS - Link Modülü */
  const links = [
    "https://otieu.com/4/10484834", "https://otieu.com/4/10498410", "https://otieu.com/4/10498413",
    "https://otieu.com/4/10498415", "https://otieu.com/4/10498414", "https://otieu.com/4/10513346",
    "https://otieu.com/4/10513352", "https://otieu.com/4/10513355", "https://otieu.com/4/10513358",
    "https://otieu.com/4/10513360"
  ];
  const linksDiv = document.getElementById("links");
  const COOLDOWN = 43200000; // 12 saat

  function format(ms){
    const t = Math.max(0, ms);
    const h = Math.floor(t / 3600000);
    const m = Math.floor((t % 3600000) / 60000);
    const s = Math.floor((t % 60000) / 1000); // Saniye eklendi
    
    if (h > 0) return `${h}sa ${m}dk`;
    return `${m}dk ${s}sn`;
  }

  function renderLinks(){
    linksDiv.innerHTML = "";
    const now = Date.now();
    
    links.forEach((url, i) => {
      const wrap = document.createElement("div");
      wrap.className = "link-wrap";
      
      const btn = document.createElement("button");
      const timer = document.createElement("div");
      timer.className = "timer";
      
      const last = Number(localStorage.getItem("link_" + i));
      const left = last ? COOLDOWN - (now - last) : 0;
      
      btn.innerText = `🔗 Link ${i+1} (+0.025 ALGO)`;
      
      if(left > 0){
        btn.disabled = true;
        timer.innerText = "Kalan süre: " + format(left);
      } else {
        btn.addEventListener("click", () => {
          // Ödülü hemen ver, hileyi önle ve yeni sekmede aç
          localStorage.setItem("link_" + i, Date.now());
          updateBalance(balance + 0.025);
          window.open(url, '_blank');
          renderLinks(); 
        });
      }
      
      wrap.appendChild(btn);
      if(left > 0) wrap.appendChild(timer);
      linksDiv.appendChild(wrap);
    });
  }
  
  // Sayaç akıcılığı için interval 1 saniyeye çekildi
  setInterval(renderLinks, 1000);
  renderLinks();

  /* ===== SPINNER (ÇARK) MODÜLÜ ===== */
  const spinCost = 0.25;
  let spinning = false;
  let currentRotation = 0; // Animasyon bug'ı için tutulan derece
  
  const prizes = [
    {label:"Yeniden Dene", amount:0, weight:999999},
    {label:"0.05 ALGO", amount:0.05, weight:800},
    {label:"0.1 ALGO", amount:0.1, weight:150},
    {label:"0.25 ALGO", amount:0.25, weight:40},
    {label:"1 ALGO", amount:1, weight:5},
    {label:"10 ALGO", amount:10, weight:1}
  ];
  
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const center = 130;
  const sliceAngle = 2 * Math.PI / prizes.length;

  // Çarkı Çiz
  function drawWheel(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    prizes.forEach((p, i) => {
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.fillStyle = `hsl(${i * 60}, 75%, 25%)`; // Renkler biraz daha koyulaştırıldı
      ctx.arc(center, center, center, i * sliceAngle, (i + 1) * sliceAngle);
      ctx.fill();
      
      // Çizgiler eklendi
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.stroke();

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(i * sliceAngle + sliceAngle / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px Arial";
      ctx.fillText(p.label, 115, 5);
      ctx.restore();
    });
  }
  drawWheel();

  function weightedPrize(){
    const pool = [];
    prizes.forEach((p, i) => { for(let j=0; j<p.weight; j++) pool.push(i); });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  const spinnerPopup = document.getElementById("spinnerPopup");
  const winPopup = document.getElementById("winPopup");
  const winText = document.getElementById("winText");

  document.getElementById("openSpinner").addEventListener("click", () => { spinnerPopup.style.display="flex" });
  document.getElementById("closeSpinnerBtn").addEventListener("click", () => { spinnerPopup.style.display="none" });

  document.getElementById("spinBtn").addEventListener("click", () => {
    if(spinning) return;
    if(balance < spinCost){ alert("Bakiye yetersiz! Çarkı çevirmek için 0.25 ALGO'ya ihtiyacınız var."); return; }
    
    spinning = true;
    updateBalance(balance - spinCost);
    
    const index = weightedPrize();
    
    // YENİ ANİMASYON MANTIĞI:
    // Hangi dilimin geleceğini hesapla (derece cinsinden)
    const sliceDeg = 360 / prizes.length;
    // Çarkın en tepesi (pointer) 270 derecedir (veya CSS'in duruşuna göre 0 varsayılır). 
    // Matematiksel olarak hedef dilimin merkez açısı:
    const targetAngle = (index * sliceDeg) + (sliceDeg / 2);
    
    // Çarkın gelmesi gereken açı: (360 - targetAngle). Ayrıca tam dönme hissi için ekstra turlar (+360 * 5) ekliyoruz.
    const spinAmount = (360 - targetAngle) + (360 * 5); 
    
    // Bir önceki dönüşün üzerine ekliyoruz ki animasyon geri sarmasın!
    // Sadece artık dereceleri (mod 360) sıfırlayarak bir sonraki dönüşü hizalıyoruz.
    const currentMod = currentRotation % 360;
    currentRotation += (360 - currentMod) + spinAmount - targetAngle;

    canvas.style.transition = "transform 4s cubic-bezier(0.15, 0.75, 0.2, 1.05)"; // Daha tok bir durma hissi
    canvas.style.transform = `rotate(${currentRotation}deg)`;
    
    setTimeout(() => {
      const p = prizes[index];
      if(p.amount > 0){ 
        updateBalance(balance + p.amount);
      }
      
      winText.innerHTML = p.amount > 0 
        ? `🎉 Tebrikler! <b>${p.label}</b> kazandınız.`
        : `😔 Maalesef boş. Lütfen tekrar deneyin.`;
        
      winPopup.style.display = "flex";
      
      setTimeout(() => { winPopup.style.display = "none"; }, 3000);
      spinning = false;
    }, 4200);
  });
});
</script>
</body>
</html>
