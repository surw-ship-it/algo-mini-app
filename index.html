<!DOCTYPE html>
<html lang="en">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#020617;font-family:Inter,system-ui,Arial;color:#fff;}
#app{min-height:100vh;padding:16px 0 80px}
.card{width:92%;max-width:390px;margin:0 auto;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:22px;}

/* DİL SEÇİCİ EKLENDİ */
.header-top {display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:30px}
.lang-switcher {display:flex; gap:6px;}
.lang-btn {width:32px; height:32px; padding:0; border-radius:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); font-size:16px; cursor:pointer; display:flex; justify-content:center; align-items:center; transition:background 0.2s;}
.lang-btn:active {background:rgba(255,255,255,0.3);}
.lang-btn.active {background:rgba(59, 130, 246, 0.5); border-color:#3b82f6;}

.balance-box{margin:20px 0;padding:18px;border-radius:18px;background:rgba(255,255,255,.14);text-align:center;}
.balance-row{display:flex;justify-content:center;align-items:center;gap:8px}.balance-amount{font-size:34px;font-weight:800}

/* Butonlar */
.action-btn {margin-top:12px;padding:14px;width:100%;border:none;border-radius:14px;color:#fff;font-size:15px;cursor:pointer;transition: opacity 0.2s}
.action-btn:active {opacity: 0.8}
.withdraw-btn{background:linear-gradient(135deg,#22c55e,#16a34a)}
.spinner-btn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.history-btn{background:linear-gradient(135deg,#475569,#334155); margin-top:8px;}

.section{margin-top:18px}.section h3{margin:0 0 10px;font-size:15px}
button{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#2563eb);transition: opacity 0.2s}
button:disabled{opacity:.5;cursor:not-allowed}
.counter{margin-top:8px;font-size:13px;color:#facc15;text-align:center}
.links{display:grid;gap:10px}
.link-wrap{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px}
.link-wrap button{padding:10px;font-size:14px;border-radius:12px;background:rgba(255,255,255,.08)}
.timer{margin-top:6px;font-size:12px;color:#facc15;text-align:center}

/* POPUPS */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;justify-content:center;align-items:center;z-index:9999;backdrop-filter:blur(4px)}
.popup-card{background:#0f172a;border-radius:20px;padding:22px;width:85%;max-width:320px;text-align:center}
.popup-card input{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#020617;color:#fff}
.popup-warn{font-size:12px;color:#facc15;margin-top:6px;margin-bottom:10px}
.reward-logo{width:56px;height:56px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.reward-logo img{width:32px}

/* GEÇMİŞ LİSTESİ */
.history-list {max-height: 250px; overflow-y: auto; text-align: left; margin-top: 15px;}
.history-item {background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1);}
.history-item div {margin-bottom: 4px; font-size: 13px;}
.status-pending {color: #facc15; font-weight: 700; font-size: 12px;}

/* SPINNER */
#spinnerPopup{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;justify-content:center;align-items:center;z-index:99999;backdrop-filter:blur(4px)}
.spinner-card{background:#0f172a;width:320px;padding:20px;border-radius:22px;text-align:center}
#wheelWrap{position:relative;width:260px;height:260px;margin:10px auto;overflow:hidden;border-radius:50%;border:4px solid #334155}
#wheel{width:100%;height:100%;border-radius:50%;}
#pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #facc15;z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
.winPopup{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.4);z-index:100000}
.winCard{background:#020617;padding:20px 26px;border-radius:18px;animation:fadeOut 3s forwards;text-align:center;font-weight:700;font-size:16px;color:#fff;border:1px solid rgba(255,255,255,0.2)}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* RTL (Arapça) için düzenlemeler */
[dir="rtl"] .history-list {text-align: right;}
[dir="rtl"] .history-item {text-align: right;}
[dir="rtl"] .brand {flex-direction: row-reverse;}
</style>
</head>

    <div class="section">

      <div class="links" id="links"></div>

  </div>
</div>

<!-- ÇEKİM TALEBİ POPUP -->
<div class="popup" id="withdrawPopup">
  <div class="popup-card">
    <div class="reward-logo">
      <img src="https://cryptologos.cc/logos/algorand-algo-logo.png">
    </div>
    <h3 data-tr="cekimTalebiTitle">Çekim Talebi</h3>
    <p><span data-tr="mevcutBakiye">Mevcut bakiye:</span> <b id="popupBalance">0.000 ALGO</b></p>
    <input id="wallet" data-tr="cuzdanPh" placeholder="Algorand cüzdan adresi">
    <input id="amount" type="number" step="0.001" data-tr="miktarPh" placeholder="Çekilecek miktar">
    <div class="popup-warn" data-tr="minCekim">Minimum çekim: 12 ALGO</div>
    <button id="sendWithdrawBtn" data-tr="btnGonder">Gönder</button>
    <button id="closeWithdrawBtn" style="margin-top:8px;background:#334155" data-tr="btnIptal">İptal</button>
  </div>
</div>

<!-- ÇEKİM GEÇMİŞİ POPUP -->
<div class="popup" id="historyPopup">
  <div class="popup-card">
    <h3 style="margin-top:0;" data-tr="gecmisTitle">📜 Çekim Geçmişi</h3>
    <div class="history-list" id="historyList">
      <!-- Veriler buraya eklenecek -->
    </div>
    <button id="closeHistoryBtn" style="margin-top:12px;background:#334155" data-tr="btnKapat">Kapat</button>
  </div>
</div>

<!-- ÇARK POPUP -->
<div id="spinnerPopup">
  <div class="spinner-card">
    <h3 style="margin-top:0;" data-tr="carkTitle">🎡 Şans Çarkı</h3>
    <p style="font-size: 13px; color:#94a3b8; margin-top: -6px;" data-tr="carkDesc">Her çevirme 0.25 ALGO değerindedir.</p>
    <div id="wheelWrap">
      <div id="pointer"></div>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>
    <button id="spinBtn" data-tr="btnCevir">Çevir (0.25 ALGO)</button>
    <button id="closeSpinnerBtn" style="margin-top:8px;background:#334155" data-tr="btnKapatCark">Kapat</button>
  </div>
</div>

<div class="winPopup" id="winPopup">
  <div class="winCard" id="winText"></div>
</div>

  let currentLang = localStorage.getItem("appLang") || "en";

  function applyLanguage() {
    // 1. Sabit HTML metinlerini güncelle
    document.querySelectorAll("[data-tr]").forEach(el => {
      const key = el.getAttribute("data-tr");
      if(el.tagName === "INPUT") {
        el.placeholder = langData[currentLang][key] || key;
      } else {
        el.innerHTML = langData[currentLang][key] || key;
      }
    });

    // 2. Arapça için sağdan sola desteği
    document.documentElement.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");

    // 3. Bayrak aktif class
    document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
    const activeBtn = document.querySelector(`.lang-btn[data-lang="${currentLang}"]`);
    if(activeBtn) activeBtn.classList.add("active");

    // 4. Dinamik alanları tetikle
    document.getElementById("adCounter").innerText = langData[currentLang].gunlukLimit + dailyAds + " / 30";
    if(typeof renderLinks === "function") renderLinks();
    if(typeof drawWheel === "function") drawWheel();
    if(document.getElementById("historyPopup").style.display === "flex") {
      document.getElementById("openHistory").click();
    }
  }

  // Bayrak butonlarına dinleyici ekle
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      currentLang = e.currentTarget.getAttribute("data-lang");
      localStorage.setItem("appLang", currentLang);
      applyLanguage();
    });
  });

  /* ================= ANA UYGULAMA (HİÇBİR ŞEY DEĞİŞTİRİLMEDİ) ================= */
  let balance = Number(localStorage.getItem("balance")) || 0;
  let dailyAds = Number(localStorage.getItem("dailyAds"));
  if (isNaN(dailyAds)) dailyAds = 30;
  
  let withdrawHistory;
  try {
    withdrawHistory = JSON.parse(localStorage.getItem("withdrawHistory")) || [];
  } catch(e) {
    withdrawHistory = [];
  }
  
  let lastDay = localStorage.getItem("lastAdDay") || new Date().toDateString();

  const balanceEl = document.getElementById("balance");
  const adCounter = document.getElementById("adCounter");

  function updateBalance(newAmount) {
    balance = newAmount;
    localStorage.setItem("balance", balance.toString());
    balanceEl.innerText = balance.toFixed(3);
  }
  
  updateBalance(balance);

  /* ADS */
  function resetAds(){
    const t = new Date().toDateString();
    if(t !== lastDay){
      dailyAds = 30;
      lastDay = t;
      localStorage.setItem("dailyAds", 30);
      localStorage.setItem("lastAdDay", t);
    }
  }
  resetAds();
  
  // İlk yüklemede dili uygula
  applyLanguage();

  document.getElementById("watchAd").addEventListener("click", async (e) => {
    if(dailyAds <= 0){ alert(langData[currentLang].alertLimitDoldu); return; }
    const btn = e.target;
    btn.disabled = true;
    
    try {
      if (typeof show_10483596 === "function") {
        await show_10483596();
      } else {
        console.warn("Offline test: SDK simüle ediliyor.");
        await new Promise(res => setTimeout(res, 1000)); 
      }
      
      dailyAds--;
      updateBalance(balance + 0.1);
      localStorage.setItem("dailyAds", dailyAds);
      adCounter.innerText = langData[currentLang].gunlukLimit + dailyAds + " / 30";
    } catch(err) {
      console.error(err);
      alert(langData[currentLang].alertHata);
    } finally {
      btn.disabled = false;
    }
  });

  const withdrawPopup = document.getElementById("withdrawPopup");
  const closeWithdrawBtn = document.getElementById("closeWithdrawBtn");
  const sendWithdrawBtn = document.getElementById("sendWithdrawBtn");
  const popupBalance = document.getElementById("popupBalance");
